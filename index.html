<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cricxcore</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SMZXC121E6');
</script>
<style>
html,body{
margin:0;
padding:0;
background:#000;
overflow:hidden;
width:100%;
height:100%;
}

#main-iframe{
width:100%;
height:100%;
border:none;
display:block;
position:absolute;
top:0;
left:0;
}

.telegram-btn{
position:absolute;
top:15px;
left:15px;
z-index:9999;
display:flex;
align-items:center;
gap:12px;
background:linear-gradient(135deg,#1e88e5,#1565c0);
padding:10px 16px;
border-radius:14px;
text-decoration:none;
color:#fff;
font-size:16px;
font-weight:600;
font-family:Arial,sans-serif;
box-shadow:0 6px 18px rgba(0,0,0,0.5);
}

.telegram-icon{
width:34px;
height:34px;
background:rgba(255,255,255,0.15);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #fff;
}

.telegram-icon svg{
width:18px;
height:18px;
fill:#fff;
}

.error-msg{
color:white;
text-align:center;
font-family:sans-serif;
margin-top:20px;
position:absolute;
width:100%;
top:50%;
transform:translateY(-50%);
}

.watermark-wrapper{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0.35;
    pointer-events:none;
    z-index:9999;
}

.tg-logo{
    width:32px;
    height:32px;
}

.watermark-text{
    font-family:Arial,sans-serif;
    font-size:24px;
    font-weight:700;
    text-transform:uppercase;
    color:#0088cc;
    text-shadow:
      0 0 4px rgba(0,0,0,.7),
      0 0 8px rgba(0,0,0,.7);
}
</style>
</head>

<body>

<a href="https://t.me/cricxcore" target="_blank" class="telegram-btn">

<div class="telegram-icon">
<svg viewBox="0 0 24 24">
<path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/>
</svg>
</div>

<span>Join @Cricxcore</span>

</a>

<iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay"></iframe>

  <div class="watermark-wrapper">

<svg class="tg-logo" viewBox="0 0 24 24" fill="none">
<path d="M21.985 3.083L3.543 10.366C1.983 11.006 2.01 11.898 3.287 12.28L7.96 13.738L19.26 6.81C19.795 6.494 20.276 6.69 19.873 7.051L10.32 15.821L9.93 20.235C10.465 20.235 10.701 19.989 11.001 19.7L15.358 15.541L21.365 20.015C22.25 20.509 22.887 20.046 23.122 18.995L24.872 4.195C25.06 2.895 24.192 2.366 21.985 3.083Z" fill="#0088cc"/>
</svg>

<span class="watermark-text">CRICXCORE</span>

</div>
  
<script>
window.addEventListener('DOMContentLoaded',()=>{

const join = confirm("Join Our Telegram Channel");

if(join){
location.href = "https://t.me/cricxcore";
}

const urlParams=new URLSearchParams(window.location.search);
const id=urlParams.get('id');
const iframe=document.getElementById('main-iframe');

if(id){
fetch('https://allrounderid2.pages.dev/id.json')
.then(res=>res.json())
.then(data=>{
const targetData=data.iframes.find(item=>item.id===id);
if(targetData && targetData.iframeSrc){
iframe.src=targetData.iframeSrc;

if(targetData.hit){
fetch(targetData.hit).catch(()=>{});
}

}else{
showError("Stream not found");
}
})
.catch(()=>{
showError("Error loading data");
});
}else{
showError("No ID provided");
}

function showError(msg){
const h2=document.createElement('h2');
h2.className='error-msg';
h2.innerText=msg;
document.body.appendChild(h2);
iframe.style.display='none';
const badge=document.querySelector('.telegram-btn');
if(badge) badge.style.display='none';
}

});
</script>
</body>
</html>
